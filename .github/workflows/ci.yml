name: Build & CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 📦 Build Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Secret scan (fail on tracked API keys)
        run: npm run secret-scan

      - name: Run Build
        run: npm run build

      - name: Verify Manifest and Dist Output
        run: |
          test -f dist/manifest.json || { echo "Missing dist/manifest.json"; exit 1; }
          test -f dist/sidepanel.html || { echo "Missing dist/sidepanel.html"; exit 1; }
          test -f dist/popup.html || { echo "Missing dist/popup.html"; exit 1; }
          echo "✅ Build verification successful!"

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnitab-extension
          path: dist/
          retention-days: 7
